<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Idea Hub · Adam Křivka</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Allerta+Stencil&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  /* ============ BRAND TOKENS (Matterhorn Alpine Theme) ============ */
  :root {
    --abyss-teal: #03212d;
    --deep-fjord: #063244;
    --glacier: #00ace1;
    --glacier-hover: #26b8e6;
    --alpine-red: #FF3B30;
    --alpine-white: #FFFFFF;
    --ice-white: #E2E8F0;

    --font-display: 'Anton', sans-serif;
    --font-stencil: 'Allerta Stencil', sans-serif;
    --font-body: 'Inter', sans-serif;

    --bg: var(--abyss-teal);
    --surface: #072e3d;
    --card-bg: #FFFFFF;
    --card-text: #245685;
    --heading: var(--alpine-white);
    --text: var(--ice-white);
    --text-dim: rgba(226, 232, 240, 0.65);
    --border: rgba(226, 232, 240, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button { font-family: inherit; cursor: pointer; border: 0; }
  input, textarea { font-family: inherit; }

  .icon-arrow, .icon-x, .icon-link, .icon-comment, .icon-plus, .icon-trash {
    width: 1em; height: 1em; display: inline-block; vertical-align: middle;
    fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ============ SCREEN SWITCHING ============ */
  .screen { display: none; height: 100%; }
  .screen.active { display: flex; }

  /* ============ AUTH SCREEN ============ */
  #auth-screen {
    align-items: center;
    justify-content: center;
    height: 100%;
    background: linear-gradient(180deg, #021822 0%, #063143 100%);
    position: relative;
    overflow: hidden;
  }

  #auth-screen svg.bgpoly { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.9; }

  .auth-card {
    position: relative;
    z-index: 2;
    width: min(380px, 92vw);
    background: rgba(4, 39, 54, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    padding: 2.25rem;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
  }

  .auth-eyebrow {
    font-weight: 700; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--glacier); display: block; margin-bottom: 0.5rem;
  }

  .auth-title {
    font-family: var(--font-display);
    font-size: clamp(1.9rem, 6vw, 2.4rem);
    text-transform: uppercase;
    color: var(--alpine-white);
    line-height: 1.05;
    margin-bottom: 1.5rem;
  }

  .field { margin-bottom: 1rem; }
  .field label {
    display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.4rem;
  }
  .field input {
    width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18);
    color: #fff; padding: 0.75rem 0.85rem; font-size: 0.9rem;
  }
  .field input:focus { outline: none; border-color: var(--glacier); }

  .btn-glacier {
    background: var(--glacier); color: var(--abyss-teal); font-weight: 800; font-size: 0.82rem;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 0.85rem 1.5rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.55rem; width: 100%;
  }
  .btn-glacier:hover { background: var(--glacier-hover); }
  .btn-glacier:disabled { opacity: 0.6; cursor: default; }

  .auth-switch {
    margin-top: 1.1rem; font-size: 0.8rem; color: var(--text-dim); text-align: center;
  }
  .auth-switch button { color: var(--glacier); font-weight: 700; }
  .auth-switch button:hover { color: var(--glacier-hover); }

  .auth-error {
    background: rgba(255, 59, 48, 0.12); border: 1px solid rgba(255, 59, 48, 0.4);
    color: #ffb3ae; font-size: 0.78rem; padding: 0.6rem 0.75rem; margin-bottom: 1rem; display: none;
  }
  .auth-error.show { display: block; }

  /* ============ APP SHELL ============ */
  #app-screen { flex-direction: column; height: 100%; }

  .topbar {
    height: 64px; flex-shrink: 0;
    background: #042330; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.25rem; z-index: 50;
  }

  .brand { display: flex; align-items: center; gap: 0.75rem; }
  .brand-mark {
    width: 32px; height: 32px; background: var(--deep-fjord); display: flex; align-items: center;
    justify-content: center; color: var(--glacier); font-family: var(--font-stencil); font-size: 0.8rem;
  }
  .brand-title { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.02em; color: #fff; text-transform: uppercase; }
  .brand-sub { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; }

  .topbar-actions { display: flex; align-items: center; gap: 0.6rem; }

  .btn-icon {
    width: 38px; height: 38px; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }
  .btn-icon:hover { border-color: var(--glacier); color: var(--glacier); }

  .btn-small {
    background: var(--glacier); color: var(--abyss-teal); font-weight: 800; font-size: 0.72rem;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 0.6rem 1rem;
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .btn-small:hover { background: var(--glacier-hover); }

  .btn-outline-sm {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    font-weight: 700; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.6rem 1rem;
  }
  .btn-outline-sm:hover { border-color: var(--glacier); color: var(--glacier); }

  /* ============ CANVAS ============ */
  .canvas-wrap {
    position: relative; flex: 1; overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(226,232,240,0.10) 1px, transparent 0) 0 0/26px 26px,
      linear-gradient(180deg, #04212d 0%, #03181f 100%);
    cursor: grab;
  }
  .canvas-wrap.panning { cursor: grabbing; }

  .canvas-world {
    position: absolute; top: 0; left: 0; width: 4000px; height: 3000px;
    transform-origin: 0 0;
  }

  svg.edges-layer { position: absolute; top: 0; left: 0; width: 4000px; height: 3000px; pointer-events: none; }

  .idea-node {
    position: absolute; width: 240px; min-height: 130px;
    background: var(--card-bg); color: var(--card-text);
    border: 1px solid rgba(4,39,54,0.15); border-left: 5px solid var(--glacier);
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    display: flex; flex-direction: column; user-select: none;
  }
  .idea-node.subidea { box-shadow: 0 6px 16px rgba(0,0,0,0.3); opacity: 0.97; }
  .idea-node.dragging { box-shadow: 0 20px 45px rgba(0,0,0,0.55); z-index: 30; }
  .idea-node.link-source { outline: 2px solid var(--alpine-red); outline-offset: 2px; }
  .idea-node.link-target-hover { outline: 2px solid var(--glacier); outline-offset: 2px; }

  .idea-node-head {
    padding: 0.6rem 0.75rem 0.3rem; cursor: grab; display: flex; align-items: flex-start; justify-content: space-between; gap: 0.4rem;
  }
  .idea-node-head:active { cursor: grabbing; }

  .idea-node h3 {
    font-family: var(--font-body); font-weight: 800; font-size: 0.88rem; line-height: 1.25;
    outline: none;
  }
  .idea-node h3[contenteditable="true"]:focus { background: rgba(0,168,255,0.08); }

  .idea-node-body {
    padding: 0 0.75rem 0.6rem; font-size: 0.76rem; color: #3a5a6e; line-height: 1.4;
    flex: 1; white-space: pre-wrap; word-break: break-word;
  }

  .idea-node-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.4rem 0.5rem; border-top: 1px solid rgba(4,39,54,0.08);
  }

  .node-btn {
    width: 26px; height: 26px; background: transparent; color: #4c7590;
    display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
  }
  .node-btn:hover { color: var(--glacier); }
  .node-btn.danger:hover { color: var(--alpine-red); }

  .node-badge {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: #4c7590; padding-left: 0.3rem;
  }

  .zoom-controls {
    position: absolute; bottom: 1.25rem; right: 1.25rem; z-index: 40;
    display: flex; flex-direction: column; gap: 0.4rem;
  }

  .hint-toast {
    position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 45;
    background: rgba(4,39,54,0.9); border: 1px solid var(--glacier); color: #fff;
    font-size: 0.78rem; padding: 0.55rem 1rem; display: none; align-items: center; gap: 0.6rem;
  }
  .hint-toast.show { display: flex; }
  .hint-toast button { color: var(--glacier); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; }

  .empty-state {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; color: var(--text-dim); pointer-events: none; width: 320px;
  }
  .empty-state h2 { font-family: var(--font-display); color: #fff; font-size: 1.6rem; text-transform: uppercase; margin-bottom: 0.5rem; }

  /* ============ DETAIL PANEL ============ */
  #detail-panel {
    position: fixed; top: 64px; right: 0; bottom: 0; width: 380px; max-width: 92vw;
    background: #052a38; border-left: 1px solid var(--border);
    box-shadow: -20px 0 40px rgba(0,0,0,0.35);
    transform: translateX(100%); transition: transform 0.22s ease;
    z-index: 80; display: flex; flex-direction: column;
  }
  #detail-panel.open { transform: translateX(0); }

  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.1rem; border-bottom: 1px solid var(--border);
  }
  .panel-head span { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--glacier); }

  .panel-body { flex: 1; overflow-y: auto; padding: 1.1rem; display: flex; flex-direction: column; gap: 1.1rem; }

  .panel-field label { display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.4rem; }
  .panel-field input[type=text], .panel-field textarea {
    width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff;
    padding: 0.6rem 0.7rem; font-size: 0.85rem; resize: vertical;
  }
  .panel-field input:focus, .panel-field textarea:focus { outline: none; border-color: var(--glacier); }

  .color-row { display: flex; gap: 0.5rem; }
  .color-dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .color-dot.active { border-color: #fff; }

  .panel-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .subidea-list, .comment-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .subidea-item {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 0.55rem 0.7rem;
    font-size: 0.8rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .subidea-item:hover { border-color: var(--glacier); }

  .comment-item { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 0.6rem 0.7rem; }
  .comment-item .meta { font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
  .comment-item .body { font-size: 0.82rem; line-height: 1.4; }

  .comment-form { display: flex; gap: 0.5rem; }
  .comment-form textarea { flex: 1; min-height: 42px; }

  .section-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--glacier); margin-bottom: 0.5rem; display: block; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

  @media (max-width: 640px) {
    #detail-panel { width: 100vw; top: 0; }
    .brand-sub { display: none; }
  }
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="auth-screen" class="screen active">
  <svg class="bgpoly" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <polygon points="0,0 600,0 350,420 0,320" fill="rgba(0,168,255,0.10)" />
    <polygon points="600,0 1200,0 950,360 350,420" fill="rgba(4,39,54,0.7)" />
    <polygon points="1200,0 1440,0 1440,440 950,360" fill="rgba(0,168,255,0.06)" />
    <polygon points="0,320 350,420 450,900 0,900" fill="rgba(4,39,54,0.5)" />
    <polygon points="350,420 950,360 850,900 450,900" fill="rgba(0,168,255,0.08)" />
    <polygon points="950,360 1440,440 1440,900 850,900" fill="rgba(4,39,54,0.85)" />
  </svg>

  <div class="auth-card">
    <span class="auth-eyebrow" id="auth-eyebrow">Private Workspace</span>
    <h1 class="auth-title" id="auth-title">Idea Hub</h1>

    <div class="auth-error" id="auth-error"></div>

    <form id="auth-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="auth-email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="auth-password" required autocomplete="current-password" minlength="6" />
      </div>
      <button type="submit" class="btn-glacier" id="auth-submit">
        <span id="auth-submit-label">Sign In</span>
      </button>
    </form>

    <div class="auth-switch">
      <span id="auth-switch-text">New here?</span>
      <button type="button" id="auth-switch-btn">Create an account</button>
    </div>
  </div>
</div>

<!-- ================= APP SCREEN ================= -->
<div id="app-screen" class="screen">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">IH</div>
      <div>
        <div class="brand-title">Idea Hub</div>
        <div class="brand-sub" id="board-name">My Idea Hub</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn-small" id="new-idea-btn">
        <svg class="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New Idea
      </button>
      <button class="btn-outline-sm" id="signout-btn">Sign Out</button>
    </div>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <div class="hint-toast" id="link-hint">
      <span>Click another idea to connect it — or</span>
      <button id="link-cancel">Cancel</button>
    </div>

    <div class="empty-state" id="empty-state">
      <h2>Blank canvas</h2>
      <p>Click "New Idea" to drop your first block, then drag to arrange, link, and grow it.</p>
    </div>

    <svg class="edges-layer" id="edges-layer"></svg>
    <div class="canvas-world" id="canvas-world"></div>

    <div class="zoom-controls">
      <button class="btn-icon" id="zoom-in">+</button>
      <button class="btn-icon" id="zoom-reset">⤾</button>
      <button class="btn-icon" id="zoom-out">−</button>
    </div>
  </div>
</div>

<!-- ================= DETAIL PANEL ================= -->
<div id="detail-panel">
  <div class="panel-head">
    <span>Idea Detail</span>
    <button class="btn-icon" id="panel-close">
      <svg class="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="panel-field">
      <label>Title</label>
      <input type="text" id="detail-title" />
    </div>
    <div class="panel-field">
      <label>Details</label>
      <textarea id="detail-body" rows="4"></textarea>
    </div>
    <div class="panel-field">
      <label>Color</label>
      <div class="color-row" id="color-row"></div>
    </div>

    <div class="panel-actions">
      <button class="btn-small" id="save-idea-btn">Save</button>
      <button class="btn-outline-sm" id="add-subidea-btn">+ Sub-idea</button>
      <button class="btn-outline-sm" id="link-mode-btn">
        <svg class="icon-link" viewBox="0 0 24 24" style="width:0.9em;height:0.9em;margin-right:0.3em;"><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h8"/></svg>
        Connect
      </button>
      <button class="btn-outline-sm" id="delete-idea-btn" style="color:#ff8a82;">Delete</button>
    </div>

    <div>
      <span class="section-label" id="subidea-label">Sub-ideas</span>
      <div class="subidea-list" id="subidea-list"></div>
    </div>

    <div>
      <span class="section-label">Comments</span>
      <div class="comment-list" id="comment-list"></div>
      <div class="comment-form" style="margin-top:0.6rem;">
        <textarea id="comment-input" placeholder="Add a comment…"></textarea>
        <button class="btn-small" id="comment-submit">Post</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   CONFIG — paste your Supabase project's URL + anon key here.
   Project Settings → API in your Supabase dashboard.
   ========================================================================= */
const SUPABASE_URL = 'https://eyvgammlolmqsylagygk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5dmdhbW1sb2xtcXN5bGFneWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjE3NzcsImV4cCI6MjEwMjAzNzc3N30.ZMNTTj_VRblCWGo-BI_ixEOxsz0EPtRJGKGIrr3zfLg';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const COLORS = ['#00ace1', '#FF3B30', '#22c55e', '#eab308', '#a855f7', '#f97316'];

/* ---------------------------------------------------------------------
   STATE
   --------------------------------------------------------------------- */
let currentUser = null;
let currentBoard = null;
let ideas = new Map();       // id -> idea row
let connections = new Map(); // id -> connection row
let selectedIdeaId = null;
let linkMode = false;
let linkSourceId = null;

let zoom = 1;
let panX = 0, panY = 0;
let isPanning = false, panStart = null;
let dragState = null; // {id, offsetX, offsetY, moved}

let authMode = 'signin'; // or 'signup'

/* ---------------------------------------------------------------------
   ELEMENTS
   --------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const authScreen = $('auth-screen');
const appScreen = $('app-screen');
const canvasWrap = $('canvas-wrap');
const canvasWorld = $('canvas-world');
const edgesLayer = $('edges-layer');
const detailPanel = $('detail-panel');
const emptyState = $('empty-state');
const linkHint = $('link-hint');

/* =========================================================================
   AUTH
   ========================================================================= */
$('auth-switch-btn').addEventListener('click', () => {
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  $('auth-submit-label').textContent = authMode === 'signin' ? 'Sign In' : 'Create Account';
  $('auth-switch-text').textContent = authMode === 'signin' ? 'New here?' : 'Already have an account?';
  $('auth-switch-btn').textContent = authMode === 'signin' ? 'Create an account' : 'Sign in';
  $('auth-error').classList.remove('show');
});

$('auth-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('auth-email').value.trim();
  const password = $('auth-password').value;
  const btn = $('auth-submit');
  const errBox = $('auth-error');
  errBox.classList.remove('show');
  btn.disabled = true;

  try {
    if (authMode === 'signin') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      errBox.textContent = 'Account created — check your inbox to confirm, then sign in.';
      errBox.classList.add('show');
      authMode = 'signin';
      $('auth-submit-label').textContent = 'Sign In';
      $('auth-switch-text').textContent = 'New here?';
      $('auth-switch-btn').textContent = 'Create an account';
    }
  } catch (err) {
    errBox.textContent = err.message || 'Something went wrong.';
    errBox.classList.add('show');
  } finally {
    btn.disabled = false;
  }
});

$('signout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
});

sb.auth.onAuthStateChange((_event, session) => {
  if (session && session.user) {
    currentUser = session.user;
    enterApp();
  } else {
    currentUser = null;
    authScreen.classList.add('active');
    appScreen.classList.remove('active');
  }
});

/* =========================================================================
   BOOTSTRAP APP
   ========================================================================= */
async function enterApp() {
  authScreen.classList.remove('active');
  appScreen.classList.add('active');

  await ensureBoard();
  await loadIdeasAndConnections();
  renderAll();
  subscribeRealtime();
}

async function ensureBoard() {
  let { data: boards, error } = await sb
    .from('boards')
    .select('*')
    .eq('owner_id', currentUser.id)
    .limit(1);

  if (error) { console.error(error); return; }

  if (boards && boards.length) {
    currentBoard = boards[0];
  } else {
    const { data, error: insErr } = await sb
      .from('boards')
      .insert({ owner_id: currentUser.id, name: 'My Idea Hub' })
      .select()
      .single();
    if (insErr) { console.error(insErr); return; }
    currentBoard = data;
  }
  $('board-name').textContent = currentBoard.name;
}

async function loadIdeasAndConnections() {
  const [{ data: ideaRows, error: iErr }, { data: connRows, error: cErr }] = await Promise.all([
    sb.from('ideas').select('*').eq('board_id', currentBoard.id).order('created_at'),
    sb.from('connections').select('*').eq('board_id', currentBoard.id),
  ]);
  if (iErr) console.error(iErr);
  if (cErr) console.error(cErr);

  ideas = new Map((ideaRows || []).map(i => [i.id, i]));
  connections = new Map((connRows || []).map(c => [c.id, c]));
}

function subscribeRealtime() {
  sb.channel('idea-hub-' + currentBoard.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ideas', filter: `board_id=eq.${currentBoard.id}` }, (payload) => {
      if (payload.eventType === 'DELETE') ideas.delete(payload.old.id);
      else ideas.set(payload.new.id, payload.new);
      renderAll();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'connections', filter: `board_id=eq.${currentBoard.id}` }, (payload) => {
      if (payload.eventType === 'DELETE') connections.delete(payload.old.id);
      else connections.set(payload.new.id, payload.new);
      renderAll();
    })
    .subscribe();
}

/* =========================================================================
   RENDER
   ========================================================================= */
function renderAll() {
  canvasWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  edgesLayer.style.transform = canvasWorld.style.transform;

  emptyState.style.display = ideas.size ? 'none' : 'block';

  canvasWorld.innerHTML = '';
  ideas.forEach(idea => canvasWorld.appendChild(buildNode(idea)));

  drawEdges();

  if (selectedIdeaId && ideas.has(selectedIdeaId)) {
    renderDetailPanel(ideas.get(selectedIdeaId));
  } else if (selectedIdeaId && !ideas.has(selectedIdeaId)) {
    closePanel();
  }
}

function buildNode(idea) {
  const el = document.createElement('div');
  el.className = 'idea-node' + (idea.parent_id ? ' subidea' : '');
  el.style.left = idea.x + 'px';
  el.style.top = idea.y + 'px';
  el.style.width = (idea.width || 240) + 'px';
  el.style.borderLeftColor = idea.color || '#00ace1';
  el.dataset.id = idea.id;

  if (linkMode && idea.id === linkSourceId) el.classList.add('link-source');

  el.innerHTML = `
    <div class="idea-node-head">
      <h3>${escapeHtml(idea.title || 'Untitled')}</h3>
    </div>
    <div class="idea-node-body">${escapeHtml(truncate(idea.body || '', 140))}</div>
    <div class="idea-node-foot">
      <span class="node-badge">${idea.parent_id ? 'Sub-idea' : ''}</span>
      <div style="display:flex;">
        <button class="node-btn" data-action="comment" title="Comments">
          <svg class="icon-comment" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="node-btn" data-action="link" title="Connect">
          <svg class="icon-link" viewBox="0 0 24 24"><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 1 1 0 10h-2M8 12h8"/></svg>
        </button>
        <button class="node-btn danger" data-action="delete" title="Delete">
          <svg class="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6h12z"/></svg>
        </button>
      </div>
    </div>
  `;

  // Click node body -> open detail panel (unless in link mode, handled separately)
  el.addEventListener('click', (e) => {
    if (dragState && dragState.moved) return; // suppress click after drag
    if (linkMode) {
      handleLinkTargetClick(idea.id);
      return;
    }
    if (e.target.closest('[data-action]')) return;
    if (e.target.tagName === 'H3') return;
    openPanel(idea.id);
  });

  // Inline title edit
  const h3 = el.querySelector('h3');
  h3.addEventListener('click', (e) => {
    if (linkMode) { handleLinkTargetClick(idea.id); return; }
    e.stopPropagation();
    h3.contentEditable = 'true';
    h3.focus();
    document.execCommand('selectAll', false, null);
  });
  h3.addEventListener('blur', async () => {
    h3.contentEditable = 'false';
    const newTitle = h3.textContent.trim() || 'Untitled';
    if (newTitle !== idea.title) {
      idea.title = newTitle;
      await sb.from('ideas').update({ title: newTitle }).eq('id', idea.id);
    }
  });
  h3.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); h3.blur(); }
  });

  // Action buttons
  el.querySelector('[data-action="comment"]').addEventListener('click', (e) => {
    e.stopPropagation(); openPanel(idea.id, { focusComments: true });
  });
  el.querySelector('[data-action="link"]').addEventListener('click', (e) => {
    e.stopPropagation(); startLinkMode(idea.id);
  });
  el.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
    e.stopPropagation(); deleteIdea(idea.id);
  });

  // Drag to move
  const head = el.querySelector('.idea-node-head');
  head.addEventListener('pointerdown', (e) => startDrag(e, idea, el));

  return el;
}

function drawEdges() {
  const svgns = 'http://www.w3.org/2000/svg';
  edgesLayer.innerHTML = `
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="var(--glacier)"></path>
      </marker>
    </defs>
  `;

  function center(idea) {
    return { x: idea.x + (idea.width || 240) / 2, y: idea.y + (idea.height || 60) / 2 };
  }

  // parent -> child (dashed)
  ideas.forEach(idea => {
    if (!idea.parent_id) return;
    const parent = ideas.get(idea.parent_id);
    if (!parent) return;
    drawLine(center(parent), center(idea), true);
  });

  // free connections (solid, with arrowhead)
  connections.forEach(conn => {
    const s = ideas.get(conn.source_id), t = ideas.get(conn.target_id);
    if (!s || !t) return;
    drawLine(center(s), center(t), false);
  });

  function drawLine(a, b, dashed) {
    const path = document.createElementNS(svgns, 'path');
    const mx = (a.x + b.x) / 2;
    const d = `M ${a.x} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`;
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', dashed ? 'rgba(226,232,240,0.35)' : 'var(--glacier)');
    path.setAttribute('stroke-width', dashed ? '1.5' : '2');
    if (dashed) path.setAttribute('stroke-dasharray', '5,5');
    else path.setAttribute('marker-end', 'url(#arrowhead)');
    edgesLayer.appendChild(path);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function truncate(str, n) { return str.length > n ? str.slice(0, n) + '…' : str; }

/* =========================================================================
   CREATE / UPDATE / DELETE IDEAS
   ========================================================================= */
$('new-idea-btn').addEventListener('click', () => createIdea());

async function createIdea(parentId = null) {
  const centerX = (-panX + canvasWrap.clientWidth / 2) / zoom - 120;
  const centerY = (-panY + canvasWrap.clientHeight / 2) / zoom - 70;

  const payload = {
    board_id: currentBoard.id,
    parent_id: parentId,
    title: 'New idea',
    body: '',
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    x: Math.max(20, centerX + (Math.random() * 60 - 30)),
    y: Math.max(20, centerY + (Math.random() * 60 - 30)),
    width: 240,
    height: 150,
    created_by: currentUser.id,
  };

  const { data, error } = await sb.from('ideas').insert(payload).select().single();
  if (error) { console.error(error); return; }
  ideas.set(data.id, data);
  renderAll();
  openPanel(data.id);
}

async function deleteIdea(id) {
  if (!confirm('Delete this idea and any sub-ideas?')) return;
  const { error } = await sb.from('ideas').delete().eq('id', id);
  if (error) { console.error(error); return; }
  ideas.delete(id);
  [...ideas.values()].filter(i => i.parent_id === id).forEach(i => ideas.delete(i.id));
  [...connections.values()].filter(c => c.source_id === id || c.target_id === id).forEach(c => connections.delete(c.id));
  if (selectedIdeaId === id) closePanel();
  renderAll();
}

/* =========================================================================
   DRAG TO REPOSITION
   ========================================================================= */
function startDrag(e, idea, el) {
  if (linkMode) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');

  const startX = e.clientX, startY = e.clientY;
  const originX = idea.x, originY = idea.y;
  dragState = { id: idea.id, moved: false };

  function onMove(ev) {
    const dx = (ev.clientX - startX) / zoom;
    const dy = (ev.clientY - startY) / zoom;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragState.moved = true;
    idea.x = originX + dx;
    idea.y = originY + dy;
    el.style.left = idea.x + 'px';
    el.style.top = idea.y + 'px';
    drawEdges();
  }

  async function onUp() {
    el.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (dragState && dragState.moved) {
      await sb.from('ideas').update({ x: idea.x, y: idea.y }).eq('id', idea.id);
    }
    setTimeout(() => { dragState = null; }, 0);
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

/* =========================================================================
   PAN & ZOOM
   ========================================================================= */
canvasWrap.addEventListener('pointerdown', (e) => {
  if (e.target !== canvasWrap && e.target !== canvasWorld && e.target.id !== 'edges-layer' && !e.target.classList.contains('edges-layer')) return;
  isPanning = true;
  canvasWrap.classList.add('panning');
  panStart = { x: e.clientX - panX, y: e.clientY - panY };
});
window.addEventListener('pointermove', (e) => {
  if (!isPanning) return;
  panX = e.clientX - panStart.x;
  panY = e.clientY - panStart.y;
  canvasWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  edgesLayer.style.transform = canvasWorld.style.transform;
});
window.addEventListener('pointerup', () => { isPanning = false; canvasWrap.classList.remove('panning'); });

canvasWrap.addEventListener('wheel', (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  setZoom(zoom + delta);
}, { passive: false });

$('zoom-in').addEventListener('click', () => setZoom(zoom + 0.15));
$('zoom-out').addEventListener('click', () => setZoom(zoom - 0.15));
$('zoom-reset').addEventListener('click', () => { zoom = 1; panX = 0; panY = 0; applyTransform(); });

function setZoom(z) { zoom = Math.min(2, Math.max(0.4, z)); applyTransform(); }
function applyTransform() {
  canvasWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  edgesLayer.style.transform = canvasWorld.style.transform;
}

/* =========================================================================
   LINK MODE (free connections between any two ideas)
   ========================================================================= */
function startLinkMode(id) {
  linkMode = true;
  linkSourceId = id;
  linkHint.classList.add('show');
  renderAll();
}
$('link-cancel').addEventListener('click', exitLinkMode);
function exitLinkMode() {
  linkMode = false;
  linkSourceId = null;
  linkHint.classList.remove('show');
  renderAll();
}

async function handleLinkTargetClick(targetId) {
  if (targetId === linkSourceId) { exitLinkMode(); return; }
  const source = linkSourceId;
  const { data, error } = await sb
    .from('connections')
    .insert({ board_id: currentBoard.id, source_id: source, target_id: targetId })
    .select()
    .single();
  if (error) { console.error(error); }
  else connections.set(data.id, data);
  exitLinkMode();
}

/* =========================================================================
   DETAIL PANEL (title, body, color, sub-ideas, comments)
   ========================================================================= */
function openPanel(id, opts = {}) {
  selectedIdeaId = id;
  detailPanel.classList.add('open');
  const idea = ideas.get(id);
  renderDetailPanel(idea);
  loadComments(id, opts.focusComments);
}

function closePanel() {
  selectedIdeaId = null;
  detailPanel.classList.remove('open');
}
$('panel-close').addEventListener('click', closePanel);

function renderDetailPanel(idea) {
  $('detail-title').value = idea.title || '';
  $('detail-body').value = idea.body || '';

  const colorRow = $('color-row');
  colorRow.innerHTML = '';
  COLORS.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (idea.color === c ? ' active' : '');
    dot.style.background = c;
    dot.addEventListener('click', () => { idea.color = c; renderDetailPanel(idea); });
    colorRow.appendChild(dot);
  });

  const subs = [...ideas.values()].filter(i => i.parent_id === idea.id);
  $('subidea-label').textContent = `Sub-ideas (${subs.length})`;
  const list = $('subidea-list');
  list.innerHTML = '';
  subs.forEach(s => {
    const row = document.createElement('div');
    row.className = 'subidea-item';
    row.innerHTML = `<span>${escapeHtml(s.title)}</span><span style="color:var(--glacier);">→</span>`;
    row.addEventListener('click', () => openPanel(s.id));
    list.appendChild(row);
  });
}

$('save-idea-btn').addEventListener('click', async () => {
  const idea = ideas.get(selectedIdeaId);
  if (!idea) return;
  idea.title = $('detail-title').value.trim() || 'Untitled';
  idea.body = $('detail-body').value;
  const { error } = await sb.from('ideas').update({
    title: idea.title, body: idea.body, color: idea.color,
  }).eq('id', idea.id);
  if (error) console.error(error);
  renderAll();
});

$('add-subidea-btn').addEventListener('click', () => {
  if (!selectedIdeaId) return;
  createIdea(selectedIdeaId);
});

$('link-mode-btn').addEventListener('click', () => {
  if (!selectedIdeaId) return;
  startLinkMode(selectedIdeaId);
});

$('delete-idea-btn').addEventListener('click', () => {
  if (!selectedIdeaId) return;
  deleteIdea(selectedIdeaId);
});

/* ---------------------------------------------------------------------
   COMMENTS
   --------------------------------------------------------------------- */
async function loadComments(ideaId, focus) {
  const { data, error } = await sb.from('comments').select('*').eq('idea_id', ideaId).order('created_at');
  if (error) { console.error(error); return; }
  renderComments(data || []);
  if (focus) $('comment-input').focus();
}

function renderComments(rows) {
  const list = $('comment-list');
  list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = '<p style="font-size:0.78rem;color:var(--text-dim);">No comments yet.</p>';
    return;
  }
  rows.forEach(c => {
    const item = document.createElement('div');
    item.className = 'comment-item';
    const date = new Date(c.created_at).toLocaleString();
    item.innerHTML = `<div class="meta">${date}</div><div class="body">${escapeHtml(c.body)}</div>`;
    list.appendChild(item);
  });
}

$('comment-submit').addEventListener('click', async () => {
  const input = $('comment-input');
  const body = input.value.trim();
  if (!body || !selectedIdeaId) return;
  const { error } = await sb.from('comments').insert({
    idea_id: selectedIdeaId, author_id: currentUser.id, body,
  });
  if (error) { console.error(error); return; }
  input.value = '';
  loadComments(selectedIdeaId);
});

/* =========================================================================
   INIT — check for an existing session on load
   ========================================================================= */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    currentUser = session.user;
    enterApp();
  }
})();
</script>
</body>
