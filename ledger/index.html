<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="apple-touch-icon" sizes="180x180" href="../src/ico/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../src/ico/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../src/ico/favicon-16x16.png">
  <link rel="manifest" href="../src/ico/site.webmanifest">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <link rel="stylesheet" href="style.css">

</head>

<body>


  <div id="login-screen">
    <h1>Ledger</h1>
    <p>Sign in to track hours.</p>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <button class="btn primary" id="login-btn" style="width:100%">Sign in</button>
    <div id="error-msg"></div>
  </div>

  <div class="wrap hidden" id="app-screen">
    <header class="top">
      <div>
        <div class="brand">Ledger<em>.</em></div>
        <div class="sub">hours worked</div>
      </div>
      <div class="header-actions">
        <a href="../" id="home-link">← Home</a>
        <button id="signout">Sign out</button>
      </div>
    </header>

    <div class="card timer-card">
      <div class="timer-status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">No session running</span>
      </div>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="session-meta" id="session-meta"></div>

      <div id="focus-visual">
        <!-- Add your two files to the same folder as index.html:
             tree-growing.gif  -> shown while running
             coffee-pause.gif  -> shown while paused
           renderTimer() below swaps the src automatically. -->
        <img id="focus-gif" src="tree-growing.gif" alt=""
             style="width:100%; border-radius:10px; display:block;"
             onerror="this.style.display='none'; document.getElementById('focus-visual-placeholder').style.display='flex';" />
        <div id="focus-visual-placeholder">your gif goes here</div>
      </div>

      <div id="pre-session-fields">
        <div class="project-row">
          <div class="col">
            <select id="project-select">
              <option value="">Select a project…</option>
              <option value="__new__">+ Add new project…</option>
            </select>
          </div>
          <div class="rate-col">
            <input type="number" id="rate-input" placeholder="Rate / hr" min="0" step="0.01" />
          </div>
          <div class="currency-col">
            <select id="currency-select">
              <option value="CZK">CZK</option>
              <option value="EUR">EUR</option>
            </select>
          </div>
        </div>
        <div id="new-project-row">
          <input type="text" id="new-project-input" placeholder="New project name, e.g. Website Aunt" />
          <button class="btn" id="new-project-confirm">Add</button>
          <button class="btn ghost" id="new-project-cancel">Cancel</button>
        </div>
        <div id="project-error"></div>

        <div class="timer-note">
          <input type="text" id="note-input" placeholder="What are you working on? (optional)" />
        </div>
      </div>

      <div class="timer-actions">
        <button class="btn primary" id="start-btn">Start</button>
        <button class="btn" id="pause-btn" style="display:none">Pause</button>
        <button class="btn running" id="resume-btn" style="display:none">Resume</button>
        <button class="btn" id="stop-btn" style="display:none; border-color:var(--danger); color:var(--danger);">Stop
          &amp; save</button>
      </div>
    </div>

    <div class="card" id="summary-card">
      <div class="summary-row">
        <div class="summary-total">
          <div class="label" id="summary-label">This month</div>
          <div class="summary-value-lines" id="summary-value">0h 00m</div>
        </div>
        <div class="filters">
          <div class="field">
            <label>Project</label>
            <select id="filter-project">
              <option value="">All projects</option>
            </select>
          </div>
          <div class="field">
            <label>From</label>
            <input type="date" id="filter-from" />
          </div>
          <div class="field">
            <label>To</label>
            <input type="date" id="filter-to" />
          </div>
          <button class="btn" id="filter-apply">Apply</button>
          <button class="btn ghost" id="filter-reset">This month</button>
        </div>
      </div>
      <div class="breakdown" id="breakdown-section" style="display:none">
        <div class="breakdown-title">By project</div>
        <div id="breakdown-list"></div>
      </div>
    </div>

    <div class="card" id="statement-card">
      <div class="entries-head" style="margin:0 0 16px;">
        <span>Print / export statement</span>
      </div>
      <div class="statement-setup">
        <div class="field">
          <label>Your name</label>
          <input type="text" id="stmt-your-name" placeholder="Jane Doe" />
        </div>
        <div class="field">
          <label>Sent to</label>
          <input type="text" id="stmt-friend-name" placeholder="Friend's name" />
        </div>
        <div class="field full">
          <label>Your bank IBAN (for the payment QR code)</label>
          <input type="text" id="stmt-iban" placeholder="CZ65 0800 0000 1920 0014 5399" />
        </div>
        <div class="field">
          <label>Variable symbol (optional)</label>
          <input type="text" id="stmt-vs" placeholder="e.g. 202607" />
        </div>
        <div class="field">
          <label>QR payment note (optional)</label>
          <input type="text" id="stmt-msg" placeholder="e.g. Hours July" />
        </div>
      </div>
      <div id="stmt-range-note"></div>
      <button class="btn primary" id="stmt-generate">Preview statement</button>
    </div>

    <div id="entries-section">
      <div class="entries-head">
        <span>Entries</span>
        <span class="count" id="entries-count">0</span>
      </div>
      <div id="entries-list"></div>
    </div>
  </div>

  <div id="print-overlay" class="hidden">
    <div class="print-toolbar no-print">
      <button class="btn ghost" id="print-close">Close</button>
      <button class="btn primary" id="print-now">Print / Save as PDF</button>
    </div>
    <div id="print-sheet">
      <h1>Hours worked</h1>
      <div class="print-sub" id="ps-period">Period</div>
      <div class="print-meta">
        <div>
          <div class="m-label">From</div>
          <div class="m-value" id="ps-from">—</div>
        </div>
        <div>
          <div class="m-label">To</div>
          <div class="m-value" id="ps-to">—</div>
        </div>
        <div>
          <div class="m-label">Project</div>
          <div class="m-value" id="ps-project">All</div>
        </div>
        <div>
          <div class="m-label">Generated</div>
          <div class="m-value" id="ps-generated">—</div>
        </div>
      </div>
      <table class="print-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Project</th>
            <th>Note</th>
            <th class="num">Duration</th>
            <th class="num">Amount</th>
          </tr>
        </thead>
        <tbody id="ps-rows"></tbody>
      </table>
      <div id="ps-currency-blocks"></div>
      <div class="print-footer">Generated with Ledger.</div>
    </div>
  </div>



  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

</body>

</html>
